<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connect Running Comeback to Strava</title><style>body{font:16px system-ui;background:#f5f7fa;color:#142333;max-width:520px;margin:45px auto;padding:20px}main{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}input,button{box-sizing:border-box;width:100%;padding:13px;margin:12px 0;font:inherit;border-radius:8px}input{border:1px solid #aab}button{background:#e65a22;color:white;border:0;font-weight:700}small{color:#567}#message{white-space:pre-wrap}</style><main><h1>Connect Strava</h1><p>Enter your private Cloudflare <strong>SETUP_KEY</strong> to authorise your Strava account. The key is not saved on this page.</p><label for="key">Setup key</label><input id="key" type="password" autocomplete="off" spellcheck="false"><button id="go">Connect my Strava account</button><p id="message" role="status"></p><small>For use on your own GitHub Pages site only. Never commit passwords or tokens to GitHub.</small></main><script>document.getElementById('go').addEventListener('click',async()=>{const key=document.getElementById('key').value;document.getElementById('key').value='';const m=document.getElementById('message');if(!key){m.textContent='Enter your setup key first.';return;}m.textContent='Requesting secure authorisation…';try{const r=await fetch('https://running-comeback-strava.drwhobe12.workers.dev/connect',{method:'POST',headers:{'Authorization':'Bearer '+key}});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');if(!j.authorization_url?.startsWith('https://www.strava.com/oauth/authorize?'))throw Error('Unexpected authorisation URL');location.assign(j.authorization_url);}catch(e){m.textContent='Connection failed: '+e.message;}});</script></html>
